<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Client Dashboard — AMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif;}
    .form-card { transition: transform 0.2s, box-shadow 0.2s; }
    .form-card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="bg-indigo-100 min-h-screen">

<!-- Header -->
<header class="bg-white border-b border-slate-100 shadow-sm sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-8 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </div>
      <span class="font-extrabold text-slate-800">AppManage</span>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-full bg-gradient-to-br from-indigo-400 to-violet-500 flex items-center justify-center text-white text-xs font-bold" id="navInitial">C</div>
        <span class="text-sm font-medium text-slate-700" id="navName">—</span>
        <span class="px-2 py-0.5 bg-violet-50 text-violet-600 text-xs font-semibold rounded-full">Client</span>
      </div>
      <button onclick="logout()" class="text-sm text-slate-400 hover:text-red-500 transition font-medium">Logout</button>
    </div>
  </div>
</header>

<!-- Main -->
<div class="max-w-6xl mx-auto px-8 py-8">

  <!-- Welcome -->
  <div class="bg-gradient-to-r from-indigo-500 to-violet-600 rounded-3xl p-8 mb-8 text-white relative overflow-hidden">
    <div class="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full -mr-20 -mt-20"></div>
    <div class="absolute bottom-0 left-0 w-48 h-48 bg-white/5 rounded-full -ml-16 mb-0"></div>
    <div class="relative">
      <h1 class="text-2xl font-extrabold mb-1">Welcome, <span id="welcomeName">—</span> 👋</h1>
      <p class="text-indigo-200 text-sm">Browse available forms and submit your applications below.</p>
      <div class="flex gap-4 mt-5">
        <div class="bg-white/10 rounded-xl px-4 py-2.5 backdrop-blur-sm shadow-sm">
          <div class="text-2xl font-bold" id="statTotal">—</div>
          <div class="text-xs text-indigo-200 mt-0.5">Available Forms</div>
        </div>
        <div class="bg-white/10 rounded-xl px-4 py-2.5 backdrop-blur-sm shadow-sm">
          <div class="text-2xl font-bold" id="statApplied">—</div>
          <div class="text-xs text-indigo-200 mt-0.5">Applied</div>
        </div>
        <div class="bg-white/10 rounded-xl px-4 py-2.5 backdrop-blur-sm shadow-sm">
          <div class="text-2xl font-bold" id="statSubmitted">—</div>
          <div class="text-xs text-indigo-200 mt-0.5">Submitted</div>
        </div>
      </div>
    </div>
  </div>

  <!-- My Applications -->
  <div id="myAppsSection" class="mb-8 hidden">
    <h2 class="text-lg font-bold text-slate-800 mb-4">My Applications</h2>
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-100 border-b border-slate-100">
          <tr>
            <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">S.No</th>
            <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Form Name</th>
            <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Form ID</th>
            <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
            <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Submitted</th>
            <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Action</th>
          </tr>
        </thead>
        <tbody id="myAppsTable" class="divide-y divide-slate-50"></tbody>
      </table>
    </div>
  </div>

  <!-- Available Forms -->
  <div>
    <h2 class="text-lg font-bold text-slate-800 mb-4">Available Application Forms</h2>
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-100 border-b border-slate-100">
          <tr>
            <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">S.No</th>
            <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Form Name</th>
            <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Form ID</th>
            <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
            <th class="text-left px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Action</th>
          </tr>
        </thead>
        <tbody id="formsTable" class="divide-y divide-slate-50"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/client.js"></script>
</body>
</html>
