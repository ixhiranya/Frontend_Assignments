<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Form Builder — AMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="bg-white border-b border-slate-100 px-8 py-4 flex items-center justify-between shadow-sm sticky top-0 z-20">
  <div class="flex items-center gap-4">
    <a href="/admin.html" class="text-slate-400 hover:text-slate-700 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <div>
      <h1 class="text-lg font-extrabold text-slate-800" id="builderTitle">Form Builder</h1>
      <p class="text-xs text-slate-400" id="formIdLabel">—</p>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <span class="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-semibold" id="formStatus">Loading...</span>
    <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition text-sm font-medium">Logout</button>
  </div>
</header>

<div class="max-w-4xl mx-auto px-8 py-8">

  <!-- Form Info -->
  <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 mb-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold text-slate-800">Form Configuration</h2>
      <button onclick="saveFormDetails()" class="px-4 py-2 bg-indigo-500 text-white rounded-xl text-sm font-semibold hover:bg-indigo-600 transition">Save Changes</button>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Form Name *</label>
        <input id="editFormName" type="text" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Status</label>
        <select id="editFormActive" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <option value="1">Active</option>
          <option value="0">Inactive</option>
        </select>
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Description</label>
        <textarea id="editFormDesc" rows="2" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white resize-none"></textarea>
      </div>
    </div>
  </div>

  <!-- Add Section -->
  <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 mb-6">
    <h2 class="font-bold text-slate-800 mb-4">Add Section</h2>
    <div class="flex gap-3">
      <input id="newSectionName" type="text" placeholder="e.g. Personal Details, Educational Details, Documents"
        class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white"/>
      <button onclick="addSection()" class="px-5 py-2.5 bg-gradient-to-r from-indigo-500 to-violet-600 text-white rounded-xl text-sm font-semibold hover:opacity-90 transition">+ Add Section</button>
    </div>
  </div>

  <!-- Sections List -->
  <div id="sectionsContainer" class="space-y-4">
    <div class="text-center py-12 text-slate-400">
      <svg class="w-12 h-12 mx-auto mb-3 opacity-30" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
      <p class="text-sm font-medium">No sections yet. Add a section to start configuring your form.</p>
    </div>
  </div>
</div>

<!-- Add Document Modal -->
<div id="addDocModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
    <h3 class="text-lg font-bold text-slate-800 mb-5">Add Document Requirement</h3>
    <input type="hidden" id="docSectionId"/>
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Document *</label>
        <select id="docSelectId" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <option value="">Select document...</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Allowed Formats</label>
        <input id="docFormats" type="text" value="pdf,jpg,jpeg,png" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="pdf,jpg,png"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Max File Size</label>
        <select id="docMaxSize" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <option value="1048576">1 MB</option>
          <option value="2097152">2 MB</option>
          <option value="5242880" selected>5 MB</option>
          <option value="10485760">10 MB</option>
        </select>
      </div>
      <div class="flex items-center gap-3">
        <input type="checkbox" id="docMandatory" checked class="w-4 h-4 rounded accent-indigo-500"/>
        <label for="docMandatory" class="text-sm font-medium text-slate-700">Mandatory document</label>
      </div>
    </div>
    <div class="flex gap-3 mt-6">
      <button onclick="closeModal('addDocModal')" class="flex-1 py-3 rounded-xl border border-slate-200 text-slate-600 font-semibold text-sm">Cancel</button>
      <button onclick="addDocConfig()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-violet-600 text-white font-semibold text-sm">Add Document</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/formBuilder.js"></script>
</body>
</html>
