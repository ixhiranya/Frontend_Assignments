<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apply Form — AMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .upload-zone { border: 2px dashed #e2e8f0; transition: all 0.2s; }
    .upload-zone:hover, .upload-zone.drag-over { border-color: #6366f1; background: #eef2ff; }
    .upload-zone.uploaded { border-color: #10b981; background: #f0fdf4; border-style: solid; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

<!-- Header -->
<header class="bg-white border-b border-slate-100 shadow-sm sticky top-0 z-20">
  <div class="max-w-4xl mx-auto px-8 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="/client.html" class="text-slate-400 hover:text-slate-700 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </a>
      <div>
        <h1 class="text-base font-extrabold text-slate-800" id="pageTitle">Application Form</h1>
        <p class="text-xs text-slate-400" id="pageSubtitle">Loading...</p>
      </div>
    </div>
    <button onclick="submitApplication()" id="submitBtn"
      class="flex items-center gap-2 px-6 py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 text-white rounded-xl font-semibold text-sm shadow-md shadow-emerald-200 hover:shadow-emerald-300 transition-all disabled:opacity-50">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      Submit Application
    </button>
  </div>
</header>

<!-- Progress -->
<div class="bg-white border-b border-slate-100" id="progressBar" style="display:none">
  <div class="max-w-4xl mx-auto px-8 py-3 flex items-center gap-3">
    <span class="text-xs font-semibold text-slate-500">Upload Progress:</span>
    <div class="flex-1 bg-slate-100 rounded-full h-2">
      <div id="progressFill" class="bg-gradient-to-r from-indigo-500 to-violet-600 h-2 rounded-full transition-all duration-500" style="width:0%"></div>
    </div>
    <span class="text-xs font-semibold text-indigo-600" id="progressText">0%</span>
  </div>
</div>

<!-- Already submitted notice -->
<div id="submittedBanner" class="hidden bg-emerald-50 border-b border-emerald-100">
  <div class="max-w-4xl mx-auto px-8 py-4 flex items-center gap-3">
    <span class="text-emerald-600 text-xl">✅</span>
    <div>
      <div class="font-bold text-emerald-800">Application Submitted Successfully</div>
      <div class="text-sm text-emerald-600">Your application has been received. You can view uploaded documents below.</div>
    </div>
  </div>
</div>

<!-- Main Content -->
<div class="max-w-4xl mx-auto px-8 py-8">
  <div id="formContent">
    <div class="text-center py-20 text-slate-400">
      <div class="inline-block w-8 h-8 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-sm">Loading form structure...</p>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/applyForm.js"></script>
</body>
</html>
