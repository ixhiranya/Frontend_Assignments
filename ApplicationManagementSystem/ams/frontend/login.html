<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Application Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-image: url("https://img.freepik.com/premium-photo/beautiful-illustration-with-smoke-colorful-background_265989-17893.jpg?semt=ais_rp_50_assets&w=740&q=80"); background-size: cover; background-position: center; background-repeat: no-repeat; }
    .grid-bg {
      background-image: linear-gradient(rgba(99,102,241,0.06) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .card-glow { box-shadow: 0 0 60px rgba(99,102,241,0.1), 0 25px 50px rgba(0,0,0,0.08); }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    /* .float { animation: float 5s ease-in-out infinite; } */
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Decorative blobs -->
  <div class="fixed top-0 left-0 w-96 h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>
  <div class="fixed bottom-0 right-0 w-96 h-96 bg-violet-200 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">

    <!-- Logo -->
    <div class="text-center mb-8 float">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-2xl shadow-md shadow-indigo-200 mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">AppManage</h1>
      <p class="text-slate-600 text-sm mt-1">Application Management System</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-3xl p-8 card-glow border border-slate-100">
      <h2 class="text-xl font-bold text-slate-800 mb-1">Welcome</h2>
      <p class="text-slate-500 text-sm mb-7">Sign in to your account or create a new one</p>

      <!-- Tabs -->
      <div class="flex mb-6">
        <button id="loginTab" class="flex-1 py-2 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600">Login</button>
        <button id="signupTab" class="flex-1 py-2 text-center font-semibold text-slate-400 border-b-2 border-slate-200">Sign Up</button>
      </div>

      <div id="errorMsg" class="hidden mb-5 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3 flex items-center gap-2">
        <span>⚠</span><span id="errorText"></span>
      </div>

      <!-- Login Form -->
      <div id="loginSection">
        <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Username</label>
          <input type="text" id="username" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent focus:bg-white transition placeholder-slate-400"
            placeholder="Enter your username"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Password</label>
          <input type="password" id="password" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent focus:bg-white transition placeholder-slate-400"
            placeholder="••••••••"/>
        </div>
        <button type="submit" id="loginBtn"
          class="w-full py-3.5 bg-gradient-to-r from-indigo-500 to-violet-600 text-white rounded-xl font-semibold text-sm shadow-lg shadow-indigo-200 hover:shadow-indigo-300 hover:from-indigo-600 hover:to-violet-700 transition-all duration-200 flex items-center justify-center gap-2">
        
          Sign In
        </button>
      </form>
      </div>

      <!-- Signup Form -->
      <div id="signupSection" class="hidden">
        <form id="signupForm" class="space-y-5">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Full Name</label>
            <input type="text" id="signupFullName" required
              class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent focus:bg-white transition placeholder-slate-400"
              placeholder="Enter your full name"/>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Username</label>
            <input type="text" id="signupUsername" required
              class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent focus:bg-white transition placeholder-slate-400"
              placeholder="Choose a username"/>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Password</label>
            <input type="password" id="signupPassword" required
              class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent focus:bg-white transition placeholder-slate-400"
              placeholder="••••••••"/>
          </div>
          <button type="submit" id="signupBtn"
            class="w-full py-3.5 bg-gradient-to-r from-indigo-500 to-violet-600 text-white rounded-xl font-semibold text-sm shadow-lg shadow-indigo-200 hover:shadow-indigo-300 hover:from-indigo-600 hover:to-violet-700 transition-all duration-200 flex items-center justify-center gap-2">
          
            Sign Up
          </button>
        </form>
      </div>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (getToken()) {
      const u = getUser();
      window.location.href = u?.role === 'Admin' ? '/admin.html' : '/client.html';
    }

    function fillAdmin()  { document.getElementById('username').value = 'admin';   document.getElementById('password').value = 'Admin@123'; }
    function fillClient() { document.getElementById('username').value = 'client1'; document.getElementById('password').value = 'Client@123'; }

    // Tab switching
    document.getElementById('loginTab').addEventListener('click', () => {
      document.getElementById('loginTab').classList.add('text-indigo-600', 'border-indigo-600');
      document.getElementById('loginTab').classList.remove('text-slate-400', 'border-slate-200');
      document.getElementById('signupTab').classList.add('text-slate-400', 'border-slate-200');
      document.getElementById('signupTab').classList.remove('text-indigo-600', 'border-indigo-600');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('signupSection').classList.add('hidden');
      document.getElementById('errorMsg').classList.add('hidden');
    });

    document.getElementById('signupTab').addEventListener('click', () => {
      document.getElementById('signupTab').classList.add('text-indigo-600', 'border-indigo-600');
      document.getElementById('signupTab').classList.remove('text-slate-400', 'border-slate-200');
      document.getElementById('loginTab').classList.add('text-slate-400', 'border-slate-200');
      document.getElementById('loginTab').classList.remove('text-indigo-600', 'border-indigo-600');
      document.getElementById('signupSection').classList.remove('hidden');
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('errorMsg').classList.add('hidden');
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="white" stroke-width="4"/><path class="opacity-75" fill="white" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Signing in...`;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('ams_token', data.token);
          localStorage.setItem('ams_user', JSON.stringify(data.user));
          window.location.href = data.user.role === 'Admin' ? '/admin.html' : '/client.html';
        } else {
          document.getElementById('errorText').textContent = data.message;
          document.getElementById('errorMsg').classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14"/></svg> Sign In`;
        }
      } catch {
        document.getElementById('errorText').textContent = 'Server error. Please try again.';
        document.getElementById('errorMsg').classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="white" stroke-width="4"/><path class="opacity-75" fill="white" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Signing up...`;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: document.getElementById('signupFullName').value.trim(),
            username: document.getElementById('signupUsername').value.trim(),
            password: document.getElementById('signupPassword').value
          })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('ams_token', data.token);
          localStorage.setItem('ams_user', JSON.stringify(data.user));
          window.location.href = '/client.html';
        } else {
          document.getElementById('errorText').textContent = data.message;
          document.getElementById('errorMsg').classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg> Sign Up`;
        }
      } catch {
        document.getElementById('errorText').textContent = 'Server error. Please try again.';
        document.getElementById('errorMsg').classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = 'Sign Up';
      }
    });
  </script>
</body>
</html>
