// Find how many cars are:

const manualAndAutoCars=cars.reduce((acc, car) => {

  } else {

  }
  return acc;
}, { manual: 0, automatic: 0 });

  return {
    ...car,
    carAge: currentYear - manufactureYear
  };
})

  return currentCarDate > newestDate ? cars : newest;
});
